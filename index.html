<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cold n Rolled</title>
    <link rel="stylesheet" href="index.css">
    <link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">
</head>
<body>
    <div class="page-shell page-alt">
        <nav class="site-nav">
            <a href="index.html" class="active">Home</a>
            <a href="events.html">Events</a>
            <a href="services.html">Services</a>
            <a href="menu.html">Menu</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>
        <header class="hero">
            <div class="hero-copy">
                <p class="eyebrow">Welcome to</p>
                <h1>Cold N Rolled</h1>
                <div class="logo-wrap">
                    <img src="coldnrolled.png" alt="Cold N Rolled logo" class="brand-logo">
                </div>
                <p class="hero-description">Freshly rolled Ice Cream</p>
            </div>
        </header>

        <section class="flavour-strip" aria-labelledby="flavour-strip-heading">
            <div class="flavour-strip-heading">
                <p class="eyebrow">A taste of what we do</p>
                <h2 id="flavour-strip-heading">Fresh flavours, freshly rolled</h2>
            </div>
            <div class="flavour-strip-window">
                <div class="flavour-strip-track">
                    <div class="flavour-strip-set">
                        <img src="vanilla.png" alt="Vanilla rolled ice cream">
                        <img src="Strawberry.png" alt="Strawberry rolled ice cream">
                        <img src="Oreo.png" alt="Oreo rolled ice cream">
                        <img src="mint.png" alt="Mint rolled ice cream">
                        <img src="Mango.png" alt="Mango rolled ice cream">
                        <img src="biscoff.png" alt="Biscoff rolled ice cream">
                    </div>
                    <div class="flavour-strip-set" aria-hidden="true">
                        <img src="vanilla.png" alt="">
                        <img src="Strawberry.png" alt="">
                        <img src="Oreo.png" alt="">
                        <img src="mint.png" alt="">
                        <img src="Mango.png" alt="">
                        <img src="biscoff.png" alt="">
                    </div>
                </div>
            </div>
        </section>

    </div>

    <button class="back-to-top" type="button" aria-label="Back to top">
        <span class="back-to-top__icon">↑</span>
        Back to top
    </button>

    <script>
        const backToTopButton = document.querySelector('.back-to-top');
        const nav = document.querySelector('.site-nav');

        const toggleBackToTop = () => {
            if (window.scrollY > 320) {
                backToTopButton.classList.add('back-to-top--visible');
            } else {
                backToTopButton.classList.remove('back-to-top--visible');
            }
        };

        const toggleNavShape = () => {
            if (window.scrollY > 0) {
                nav.classList.add('site-nav--scrolled');
            } else {
                nav.classList.remove('site-nav--scrolled');
            }
        };

        backToTopButton.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        window.addEventListener('scroll', () => {
            toggleBackToTop();
            toggleNavShape();
        });
        window.addEventListener('load', () => {
            toggleBackToTop();
            toggleNavShape();
        });
    </script>
</body>
</html>
